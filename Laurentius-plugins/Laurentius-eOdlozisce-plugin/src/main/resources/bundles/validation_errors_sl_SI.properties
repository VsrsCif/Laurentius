# Schema validation errors
MISSING_METADATA_XML = Manjka metapodatkovna datoteka XML
INVALID_XML = Neveljavna datoteka XML

# Filing validation errors
MISSING_COURT_CODE = Manjka koda sodi??a
INVALID_COURT_CODE = Neveljavna koda sodi??a
INVALID_FIELD_OF_LAW = Neveljavno pravno podro?je
INVALID_REGISTER = Neveljavno registri
MISSING_JOB_NUMBER = Manjka ?tevilka zadeve
MISSING_ISSUE_NUMBER = Manjka ?tevilka izdaje

# PDF validation errors
NOT_PDF_A = Datoteka ni v formatu PDF/A
PDF_NOT_SIGNED = Vodilna PDF datoteka ni podpisana
PDF_SIGNATURES_NOT_VALID = Vodilna PDF datoteka ima neveljavne podpise
UNSUPPORTED_PDF_SIGNATURE = Vodilna PDF datoteka ima nepodprt podpis

# XML signature validation errors
SIGNATURE_NOT_FOUND = Element podpisa ni bil najden
INVALID_SIGNATURE = Neveljaven podpis
