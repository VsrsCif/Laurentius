# Schema validation errors
MISSING_METADATA_XML = Manjka metapodatkovna datoteka XML
INVALID_XML = Neveljavna datoteka XML

# Filing validation errors
MISSING_COURT_CODE = Manjka koda sodi\u0161\u010da
INVALID_COURT_CODE = Neveljavna koda sodi\u0161\u010da
INVALID_FIELD_OF_LAW = Neveljavno pravno podro\u010dje
