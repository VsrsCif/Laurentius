# PDF validation errors
NOT_PDF_A = Datoteka ni v formatu PDF/A
PDF_NOT_SIGNED = Vodilna PDF datoteka ni podpisana
PDF_SIGNATURES_NOT_VALID = Vodilna PDF datoteka ima neveljavne podpise
